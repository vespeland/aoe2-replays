name: Publish replay artifact

on:
  push:
    paths:
      - latest.aoe2record
      - latest.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload latest AoE2 replay
        uses: actions/upload-artifact@v4
        with:
          name: latest-aoe2-replay
          path: latest.aoe2record
          if-no-files-found: error
          retention-days: 30

      - name: Publish run pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          REPLAY_SHA=$(jq -r '.sha256' latest.json)
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "latest-aoe2-replay") | .id' | head -n 1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Could not find latest-aoe2-replay artifact" >&2
            exit 1
          fi
          jq -n \
            --argjson run_id "$RUN_ID" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg sha256 "$REPLAY_SHA" \
            --arg published_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_id:$run_id, artifact_id:$artifact_id, sha256:$sha256, artifact_name:"latest-aoe2-replay", published_utc:$published_utc}' \
            > latest-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- latest-run.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update latest replay run pointer"
          git push
